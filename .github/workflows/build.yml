name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Test and build
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest assembleRelease

      - name: Collect APK
        run: cp app/build/outputs/apk/release/app-release.apk CacheCleaner.apk

      - uses: actions/upload-artifact@v4
        with:
          name: CacheCleaner-apk
          path: CacheCleaner.apk

      # Keeps one "latest" release with the newest APK, so it can be downloaded straight to a
      # phone from the repository's Releases page.
      - name: Publish latest release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest CacheCleaner.apk \
            --target "$GITHUB_SHA" \
            --title "Cache Cleaner (latest build)" \
            --notes "Built from ${GITHUB_REF_NAME} at ${GITHUB_SHA::7}. On your phone, download CacheCleaner.apk and open it to install."
